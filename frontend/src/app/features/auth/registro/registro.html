<div class="w-full min-h-screen bg-ibus-blue flex flex-col relative font-roboto">
  
  <!-- Waves Header (ondasSign style) -->
  <div class="relative w-full h-[280px] overflow-hidden md:h-[340px] bg-white flex-shrink-0">
    <!-- SVG Background (olasSignSolas) -->

      <path d="M0 80.869L9.84222 78.654C19.6844 76.439 39.3689 72.009 58.9618 76.8082C78.6004 81.6073 98.1018 95.6357 117.74 94.8973C137.333 94.159 157.018 78.654 176.611 74.4455C196.249 70.3108 215.751 77.3989 235.389 82.4934C254.982 87.514 274.667 90.4674 294.26 88.0309C313.898 85.5205 333.4 77.6942 353.038 73.338C372.631 69.0557 392.316 68.3173 402.158 67.9482L412 67.579V179.067H402.158C392.316 179.067 372.631 179.067 353.038 179.067C333.4 179.067 313.898 179.067 294.26 179.067C274.667 179.067 254.982 179.067 235.389 179.067C215.751 179.067 196.249 179.067 176.611 179.067C157.018 179.067 137.333 179.067 117.74 179.067C98.1018 179.067 78.6004 179.067 58.9618 179.067C39.3689 179.067 19.6844 179.067 9.84222 179.067H0V80.869Z" fill="#0C3B6C"/>
      <path d="M0 100.804H9.84222C19.6844 100.804 39.3689 100.804 58.9618 102.428C78.6004 103.979 98.1018 107.228 117.74 108.778C137.333 110.402 157.018 110.402 176.611 108.704C196.249 106.932 215.751 103.536 235.389 106.342C254.982 109.147 274.667 118.303 294.26 123.692C313.898 129.082 333.4 130.854 353.038 130.854C372.631 130.854 392.316 129.082 402.158 128.27L412 127.384V179.067H402.158C392.316 179.067 372.631 179.067 353.038 179.067C333.4 179.067 313.898 179.067 294.26 179.067C274.667 179.067 254.982 179.067 235.389 179.067C215.751 179.067 196.249 179.067 176.611 179.067C157.018 179.067 137.333 179.067 117.74 179.067C98.1018 179.067 78.6004 179.067 58.9618 179.067C39.3689 179.067 19.6844 179.067 9.84222 179.067H0V100.804Z" fill="#0A2C51"/>
      <path d="M0 153.226L9.84222 151.38C19.6844 149.534 39.3689 145.842 58.9618 141.191C78.6004 136.466 98.1018 130.854 117.74 129.968C137.333 129.082 157.018 133.069 176.611 134.398C196.249 135.727 215.751 134.546 235.389 135.137C254.982 135.727 274.667 138.238 294.26 137.573C313.898 136.982 333.4 133.291 353.038 135.284C372.631 137.204 392.316 144.883 402.158 148.648L412 152.487V179.067H402.158C392.316 179.067 372.631 179.067 353.038 179.067C333.4 179.067 313.898 179.067 294.26 179.067C274.667 179.067 254.982 179.067 235.389 179.067C215.751 179.067 196.249 179.067 176.611 179.067C157.018 179.067 137.333 179.067 117.74 179.067C98.1018 179.067 78.6004 179.067 58.9618 179.067C39.3689 179.067 19.6844 179.067 9.84222 179.067H0V153.226Z" fill="#081E37"/>
    </svg>

    <!-- Logo (Alone at the top on white background) -->
    <div class="absolute top-6 left-1/2 -translate-x-1/2 w-[110px] h-[110px] md:w-[130px] md:h-[130px]">
      <img src="Azul-Sol.svg" alt="I-BuS Logo" class="w-full h-full object-contain">
    </div>

    <!-- Word I-BuS (Overlaid on the waves in white) -->
    <h2 class="absolute bottom-12 left-1/2 -translate-x-1/2 font-barlow font-black text-[34px] text-white tracking-wide md:text-[38px] z-10">I-BuS</h2>
  </div>

  <!-- Bottom Dark Blue Area (Full Width) -->
  <div class="flex-1 bg-ibus-blue px-6 pt-6 pb-12 flex flex-col justify-between md:pt-10 md:pb-16 z-10">
    
    <div class="w-full max-w-[420px] md:max-w-[600px] mx-auto flex flex-col">
      <!-- Registrarse Title -->
      <h1 class="font-barlow font-extrabold text-[28px] text-ibus-yellow text-center mb-8 tracking-wide md:text-[34px] md:mb-12">
        Registrarse
      </h1>

      <!-- Error Message Banner -->
      <div *ngIf="mensajeError" class="mb-5 p-3.5 bg-red-950/40 border border-red-500/30 text-[#FFB9B9] rounded-lg text-xs font-inter flex items-center gap-2">
        <svg class="w-4.5 h-4.5 text-red-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
        <span>{{ mensajeError }}</span>
      </div>

      <!-- Success Message Card -->
      <div *ngIf="mensajeExito" class="w-full bg-white/5 border border-emerald-500/20 rounded-2xl p-6 font-inter text-center flex flex-col items-center shadow-lg my-4 animate-fade-in">
        <div class="w-16 h-16 bg-emerald-950/40 border border-emerald-500/30 text-emerald-400 rounded-full flex items-center justify-center mb-5">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
          </svg>
        </div>
        <h2 class="font-barlow font-bold text-[24px] text-ibus-yellow mb-3">
          ¡Registro Completado!
        </h2>
        <p class="text-white/80 text-[14px] leading-relaxed mb-6 max-w-[320px]">
          {{ mensajeExito }}
        </p>
        
        <a routerLink="/auth/login" class="px-8 py-3 rounded-xl font-barlow font-bold text-[15px] bg-ibus-yellow text-ibus-blue hover:bg-opacity-90 transition-all shadow-md active:scale-95">
          Ir al Inicio de Sesión
        </a>
      </div>

      <!-- Form -->
      <form *ngIf="!mensajeExito" [formGroup]="registroForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-6 w-full">
        
        <!-- Nombre Input -->
        <div class="relative w-full">
          <label [ngClass]="hasError('nombre') ? 'text-red-400' : 'text-white/80'"
            class="absolute -top-[10px] left-3 bg-ibus-blue px-2 font-roboto font-bold text-[12px] tracking-[0.4px] z-10 transition-colors">
            Nombre
          </label>
          <div [ngClass]="hasError('nombre') ? 'border-red-500 focus-within:border-red-500 bg-red-500/5' : 'border-white/40 focus-within:border-ibus-yellow'"
            class="flex items-center border rounded-lg h-[54px] relative z-0 transition-colors">
            <div class="pl-4 pr-2 flex justify-center items-center text-white/60">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
              </svg>
            </div>
            <input formControlName="nombre" type="text" placeholder="Usuario Pérez"
              class="w-full bg-transparent text-white font-roboto text-[15px] focus:outline-none placeholder-white/30 pr-4">
          </div>
          <!-- Inline Error Message -->
          <div *ngIf="hasError('nombre')" class="mt-1.5 text-red-400 text-xs font-inter flex items-center gap-1.5 pl-1">
            <svg class="w-3.5 h-3.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
            <span>{{ getErrorMessage('nombre') }}</span>
          </div>
        </div>

        <!-- Email Input -->
        <div class="relative w-full">
          <label [ngClass]="hasError('email') ? 'text-red-400' : 'text-white/80'"
            class="absolute -top-[10px] left-3 bg-ibus-blue px-2 font-roboto font-bold text-[12px] tracking-[0.4px] z-10 transition-colors">
            Correo Electrónico
          </label>
          <div [ngClass]="hasError('email') ? 'border-red-500 focus-within:border-red-500 bg-red-500/5' : 'border-white/40 focus-within:border-ibus-yellow'"
            class="flex items-center border rounded-lg h-[54px] relative z-0 transition-colors">
            <div class="pl-4 pr-2 flex justify-center items-center text-white/60">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
              </svg>
            </div>
            <input formControlName="email" type="email" placeholder="ejemplo@gmail.com"
              class="w-full bg-transparent text-white font-roboto text-[15px] focus:outline-none placeholder-white/30 pr-4">
          </div>
          <!-- Inline Error Message -->
          <div *ngIf="hasError('email')" class="mt-1.5 text-red-400 text-xs font-inter flex items-center gap-1.5 pl-1">
            <svg class="w-3.5 h-3.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
            <span>{{ getErrorMessage('email') }}</span>
          </div>
        </div>

        <!-- Password Input -->
        <div class="relative w-full">
          <label [ngClass]="hasError('password') ? 'text-red-400' : 'text-white/80'"
            class="absolute -top-[10px] left-3 bg-ibus-blue px-2 font-roboto font-bold text-[12px] tracking-[0.4px] z-10 transition-colors">
            Contraseña
          </label>
          <div [ngClass]="hasError('password') ? 'border-red-500 focus-within:border-red-500 bg-red-500/5' : 'border-white/40 focus-within:border-ibus-yellow'"
            class="flex items-center border rounded-lg h-[54px] relative z-0 transition-colors">
            <div class="pl-4 pr-2 flex justify-center items-center text-white/60">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8V7z" />
              </svg>
            </div>
            <input formControlName="password" type="password" placeholder="••••••••••••"
              class="w-full bg-transparent text-white font-roboto text-[15px] focus:outline-none placeholder-white/30 pr-4">
          </div>
          <!-- Inline Error Message -->
          <div *ngIf="hasError('password')" class="mt-1.5 text-red-400 text-xs font-inter flex items-center gap-1.5 pl-1">
            <svg class="w-3.5 h-3.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
            <span>{{ getErrorMessage('password') }}</span>
          </div>
        </div>

        <!-- Terms Checkbox -->
        <div class="flex flex-col items-start w-full mt-1">
          <label class="flex items-start gap-3 cursor-pointer select-none">
            <input type="checkbox" formControlName="terminos"
              class="mt-1 w-4 h-4 rounded border border-white/40 bg-transparent checked:bg-ibus-yellow accent-ibus-yellow focus:ring-0">
            <span [ngClass]="hasError('terminos') ? 'text-red-400' : 'text-white/90'"
              class="font-inter text-[12px] leading-tight transition-colors">
              Estoy de acuerdo con los <span class="text-ibus-yellow font-bold hover:underline">Términos y Condiciones</span>
            </span>
          </label>
          <!-- Inline Error Message -->
          <div *ngIf="hasError('terminos')" class="mt-1.5 text-red-400 text-xs font-inter flex items-center gap-1.5 pl-1">
            <svg class="w-3.5 h-3.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
            <span>{{ getErrorMessage('terminos') }}</span>
          </div>
        </div>

        <!-- Submit Button -->
        <div class="flex justify-center mt-6">
          <button type="submit" [disabled]="cargando"
            class="px-10 py-3 rounded-lg font-barlow font-bold text-[16px] bg-ibus-yellow text-ibus-blue hover:bg-opacity-95 active:scale-95 transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
            <span *ngIf="cargando" class="w-4 h-4 border-2 border-ibus-blue border-t-transparent rounded-full animate-spin"></span>
            {{ cargando ? 'Registrando...' : 'Registrarme' }}
          </button>
        </div>

      </form>
    </div>

    <!-- Footer Link -->
    <div class="text-center mt-8">
      <p class="font-inter text-[13px] text-white/80">
        ¿Ya tienes una cuenta? 
        <a routerLink="/auth/login" class="text-ibus-yellow font-bold hover:underline cursor-pointer ml-1">
          Inicia Sesión
        </a>
      </p>
    </div>

  </div>

</div>
