    <!-- Overlay Content -->
    <div class="relative w-full max-w-[420px] md:max-w-[750px] mx-auto flex justify-center items-center px-6 pt-10 pb-4 z-10 md:pt-16">
      <!-- Back Arrow -->
      <a routerLink="/admin/dashboard" class="absolute left-6 cursor-pointer text-white hover:text-ibus-yellow transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
      </a>

      <!-- Logo Title -->
      <h2 class="font-barlow font-black text-[38px] text-white tracking-wide mt-2 md:text-[44px]">I-BuS</h2>
    </div>
  </div>

  <!-- Bottom Dark Blue Area (Full Width) -->
  <div class="flex-1 bg-ibus-blue px-6 pb-12 flex flex-col justify-between z-10 md:pb-16">
    
    <div class="w-full max-w-[420px] md:max-w-[750px] mx-auto flex flex-col">
      <!-- Title -->
      <h1 class="font-barlow font-extrabold text-[26px] text-ibus-yellow text-center mb-6 tracking-wide md:text-[30px]">
        Gestionar Barrios
      </h1>

      <!-- Feedback Banner -->
      <div *ngIf="mensajeFeedback" [class]="'w-full p-3 rounded-lg text-center font-bold text-[13px] mb-4 border ' + (tipoFeedback === 'exito' ? 'bg-green-500/20 border-green-500/50 text-green-300' : 'bg-red-500/20 border-red-500/50 text-red-300')">
        {{ mensajeFeedback }}
      </div>

      <form [formGroup]="barrioForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-6 w-full" (click)="$event.stopPropagation()">
        
        <!-- Search Row -->
        <div class="flex items-center gap-3 w-full mb-2 relative">
          <!-- Search input -->
          <div class="flex-1 flex items-center border border-white/40 rounded-lg h-[46px] px-3 bg-transparent">
            <input formControlName="buscar" type="text" placeholder="Buscar Barrio..."
              (input)="onSearchInput()" (focus)="onSearchInput()" (click)="$event.stopPropagation(); onSearchInput()"
              class="w-full bg-transparent text-white font-roboto text-[14px] focus:outline-none placeholder-white/40 pr-2">
            <div class="text-white/60 cursor-pointer">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
              </svg>
            </div>
          </div>
          <!-- Add Button -->
          <button type="button" (click)="onNuevoBarrio()" class="h-[46px] px-4 bg-ibus-yellow text-ibus-blue font-inter font-bold text-[14px] rounded-lg hover:bg-opacity-90 active:scale-95 transition-all whitespace-nowrap">
            + Barrio
          </button>

          <!-- Search results dropdown overlay -->
          <div *ngIf="showSearchResults && searchResults.length > 0" (click)="$event.stopPropagation()" class="absolute left-0 top-[52px] w-full max-h-[200px] overflow-y-auto bg-ibus-blue border border-white/20 rounded-lg shadow-xl z-50">
            <div *ngFor="let b of searchResults" (click)="selectBarrio(b)" class="px-4 py-3 hover:bg-white/10 cursor-pointer border-b border-white/10 flex flex-col gap-1 transition-colors">
              <span class="font-roboto font-bold text-[13px] text-ibus-yellow text-left">Barrio ID: {{ b.id }}</span>
              <span class="text-[12px] text-white/90 text-left">Nombre: {{ b.nombre }}</span>
            </div>
          </div>
          <div *ngIf="showSearchResults && searchResults.length === 0 && this.barrioForm.get('buscar')?.value" class="absolute left-0 top-[52px] w-full bg-ibus-blue border border-white/20 rounded-lg p-4 shadow-xl z-50 text-center text-white/60 text-[13px]">
            No se encontraron barrios con esa búsqueda
          </div>
        </div>

        <!-- Inputs Row 1 (Id Barrio & Nombre) -->
        <div class="grid grid-cols-2 gap-4">
          <!-- Id Barrio -->
          <div class="relative w-full">
            <label class="absolute -top-[10px] left-3 bg-ibus-blue px-2 font-roboto font-bold text-[11px] text-white/80 tracking-[0.4px] z-10">
              Id Barrio
            </label>
            <div class="flex items-center border border-white/20 rounded-lg h-[50px] relative z-0 bg-white/5">
              <input formControlName="idBarrio" type="text"
                class="w-full bg-transparent text-white/60 font-roboto text-[14px] focus:outline-none px-4">
            </div>
          </div>
          
          <!-- Nombre Barrio -->
          <div class="relative w-full">
            <label class="absolute -top-[10px] left-3 bg-ibus-blue px-2 font-roboto font-bold text-[11px] text-white/80 tracking-[0.4px] z-10">
              Nombre Barrio
            </label>
            <div class="flex items-center border border-white/40 rounded-lg h-[50px] relative z-0 px-4">
              <input formControlName="nombreBarrio" type="text"
                class="w-full bg-transparent text-white font-roboto text-[14px] focus:outline-none">
            </div>
          </div>
        </div>

        <!-- Rutas Asignadas Area -->
        <div class="relative w-full">
          <label class="absolute -top-[10px] left-3 bg-ibus-blue px-2 font-roboto font-bold text-[11px] text-white/80 tracking-[0.4px] z-10">
            Rutas Asignadas
          </label>
          <div class="flex flex-wrap items-center gap-2 border border-white/40 rounded-lg min-h-[50px] relative z-0 p-3">
            
            <!-- Chips for assigned routes -->
            @for (ruta of rutasAsignadas; track $index) {
              <div class="flex items-center gap-1.5 bg-white/10 hover:bg-white/20 transition-colors border border-white/20 rounded-full pl-3 pr-2 py-1">
                <span class="font-inter text-[12px] text-white font-semibold">{{ getRouteName(ruta) }}</span>
                <button type="button" (click)="quitarRuta(ruta)" class="text-white/60 hover:text-ibus-red active:scale-90 transition-all font-bold text-[12px] flex items-center justify-center w-4 h-4 rounded-full bg-black/10">
                  ×
                </button>
              </div>
            }

            <div *ngIf="selectedBarrioId && rutasAsignadas.length === 0" class="text-white/40 font-roboto text-[12px] py-1">
              Sin rutas asignadas
            </div>
            <div *ngIf="!selectedBarrioId" class="text-white/40 font-roboto text-[12px] py-1">
              Selecciona o crea un barrio para ver sus rutas
            </div>

            <!-- Add Plus Button inside border -->
            <button *ngIf="selectedBarrioId" type="button" (click)="agregarRutaClick()" class="w-7 h-7 rounded-full bg-white/5 border border-white/20 flex items-center justify-center text-white/80 hover:bg-white/10 hover:text-white active:scale-95 transition-all ml-auto">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
              </svg>
            </button>

          </div>
        </div>

        <!-- Selector de rutas a agregar -->
        <div *ngIf="mostrarSelectorRutas" class="relative w-full -mt-2">
          <label class="absolute -top-[10px] left-3 bg-ibus-blue px-2 font-roboto font-bold text-[11px] text-white/80 tracking-[0.4px] z-10">
            Asignar a Ruta
          </label>
          <div class="flex items-center border border-ibus-yellow rounded-lg h-[50px] relative z-0 px-4 bg-white/5">
            <select (change)="onSeleccionarRutaParaAgregar($event)" class="w-full bg-transparent text-white font-roboto text-[14px] focus:outline-none" style="color-scheme: dark;">
              <option value="">-- Selecciona una ruta para agregar este barrio --</option>
              <option *ngFor="let r of rutasDisponibles" [value]="r.id">{{ getRouteName(r) }}</option>
            </select>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex justify-between items-center w-full mt-6 gap-4">
          <!-- Actualizar -->
          <button type="submit" [disabled]="barrioForm.invalid" class="flex-1 py-3 rounded-lg font-barlow font-bold text-[15px] bg-ibus-yellow text-ibus-blue hover:bg-opacity-95 active:scale-95 transition-all text-center disabled:opacity-40">
            {{ selectedBarrioId ? 'Actualizar Barrio' : 'Guardar Barrio' }}
          </button>
          
          <!-- Eliminar -->
          <button *ngIf="selectedBarrioId" type="button" (click)="onEliminar()" class="px-6 py-3 rounded-lg font-barlow font-bold text-[15px] bg-ibus-red text-ibus-dark-red hover:bg-opacity-95 active:scale-95 transition-all flex justify-center items-center">
            <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
            <span>Eliminar</span>
          </button>
        </div>

      </form>
    </div>

  </div>

</div>
